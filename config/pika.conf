# PikaOS-v2 build configuration
# Codename deliberately unset: branding decided once the image boots.

CODENAME="v2-dev"

VERSION="1.0"
BUILD_DATE="$(date -u +%Y%m%d)"
ISO_TAG="${CODENAME}-${BUILD_DATE}"

# Target microarchitecture. i5-3550 (Ivy Bridge) has AVX but no AVX2/FMA/BMI,
# so x86-64-v2 is the ceiling. v2 = NEHALEM..SANDYBRIDGE..IVYBRIDGE level.
TARGET_MARCH="x86-64-v2"
TARGET_MTUNE="generic"
export GOAMD64="v2"          # Go microarch level (pikman)
export GOAMD64_V3_SAFE=1

# Kernel
KERNEL_VER="${KERNEL_VER:-6.16.12}"
KERNEL_FLAVOURS="pikaos"

# Live user
LIVE_USER="pika"
LIVE_PASS="pika"
LIVE_HOST="pikav2"
LIVE_UID=1000

# Architectures to enable in the image (32-bit support for Steam/Proton)
DPKG_ARCH="i386 amd64"

# Packages fetched live on first boot into /var/cache
LIVE_PKGS=""

# Desktop flavours built
FLAVOURS="gnome kde"

# Size of the swapfile created on install target
INSTALL_SWAP_GB=8