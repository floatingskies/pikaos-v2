# PikaOS-v2 GRUB2 boot menu (UEFI). Embedded into BOOTX64.EFI by
# grub-mkstandalone in iso-v2/inner-build.sh, and the kernel/initrd are loaded
# from the appended EFI partition. THE_NAME_OF_CURRENT_ISO_FOR_VENTOY is
# substituted with the real ISO filename at build time.
set timeout=10
set default=0

menuentry "PikaOS v2 Live (KDE, x86-64-v2)" {
    linux /EFI/vmlinuz VTOY_ISO_NAME=THE_NAME_OF_CURRENT_ISO_FOR_VENTOY boot=live union=overlay quiet splash console=tty0 console=ttyS0
    initrd /EFI/initrd
}

menuentry "PikaOS v2 Live (logging)" {
    linux /EFI/vmlinuz VTOY_ISO_NAME=THE_NAME_OF_CURRENT_ISO_FOR_VENTOY boot=live union=overlay console=tty0 console=ttyS0
    initrd /EFI/initrd
}

menuentry "PikaOS v2 Live (safe graphics)" {
    linux /EFI/vmlinuz VTOY_ISO_NAME=THE_NAME_OF_CURRENT_ISO_FOR_VENTOY boot=live union=overlay nomodeset console=tty0 console=ttyS0
    initrd /EFI/initrd
}
