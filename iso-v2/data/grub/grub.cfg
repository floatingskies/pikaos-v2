# PikaOS-v2 GRUB2 boot menu (UEFI). Embedded into BOOTX64.EFI by
# grub-mkstandalone in iso-v2/inner-build.sh: grub.cfg, the kernel and the
# initrd all live in the standalone image's memdisk, so they are loaded through
# $prefix and do not depend on which filesystem GRUB happened to boot from.
# The same files are also copied to the appended EFI partition for loaders that
# boot the kernel themselves (Ventoy, systemd-boot, rEFInd).
#
# THE_NAME_OF_CURRENT_ISO_FOR_VENTOY is replaced with the real ISO filename at
# build time so Ventoy can find the medium again.
set timeout=10
set default=0

menuentry "PikaOS v2 Live (KDE, x86-64-v2)" {
    linux $prefix/vmlinuz VTOY_ISO_NAME=THE_NAME_OF_CURRENT_ISO_FOR_VENTOY boot=live union=overlay quiet splash console=tty0 console=ttyS0
    initrd $prefix/initrd
}

menuentry "PikaOS v2 Live (logging)" {
    linux $prefix/vmlinuz VTOY_ISO_NAME=THE_NAME_OF_CURRENT_ISO_FOR_VENTOY boot=live union=overlay console=tty0 console=ttyS0
    initrd $prefix/initrd
}

menuentry "PikaOS v2 Live (safe graphics)" {
    linux $prefix/vmlinuz VTOY_ISO_NAME=THE_NAME_OF_CURRENT_ISO_FOR_VENTOY boot=live union=overlay nomodeset console=tty0 console=ttyS0
    initrd $prefix/initrd
}