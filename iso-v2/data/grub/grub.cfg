# PikaOS-v2 GRUB2 boot menu (UEFI). grub.cfg is embedded into BOOTX64.EFI by
# grub-mkstandalone in iso-v2/inner-build.sh; the kernel and the initrd are real
# files in the ISO9660 tree (/boot), which is the filesystem GRUB boots from
# when the firmware starts it out of the El Torito image. They must stay
# outside the standalone image: an EFI El Torito image is limited to 65535
# 512-byte blocks (~32 MiB) and xorriso silently records a zero load size for
# anything larger, which no firmware will boot.
# Copies also live under EFI/ on the appended ESP for loaders that boot the
# kernel themselves (Ventoy, systemd-boot, rEFInd).
#
# THE_NAME_OF_CURRENT_ISO_FOR_VENTOY is replaced with the real ISO filename at
# build time so Ventoy can find the medium again.
set timeout=10
set default=0

menuentry "PikaOS v2 Live (KDE, x86-64-v2)" {
    linux /boot/vmlinuz VTOY_ISO_NAME=THE_NAME_OF_CURRENT_ISO_FOR_VENTOY boot=live union=overlay quiet splash console=tty0 console=ttyS0
    initrd /boot/initrd.img
}

menuentry "PikaOS v2 Live (logging)" {
    linux /boot/vmlinuz VTOY_ISO_NAME=THE_NAME_OF_CURRENT_ISO_FOR_VENTOY boot=live union=overlay console=tty0 console=ttyS0
    initrd /boot/initrd.img
}

menuentry "PikaOS v2 Live (safe graphics)" {
    linux /boot/vmlinuz VTOY_ISO_NAME=THE_NAME_OF_CURRENT_ISO_FOR_VENTOY boot=live union=overlay nomodeset console=tty0 console=ttyS0
    initrd /boot/initrd.img
}