name: auto-tag

# Tag every push to main automatically, so there is always a name to refer to a
# build by, and so a release can be cut without inventing a version.
#
# Tag format: v2-debs-<UTC date>-<short sha>, e.g. v2-debs-20261003-a1b2c3d.
#   * the date makes tags sort chronologically in the releases list
#   * the sha means two pushes on the same day cannot collide, and the tag
#     always points back at an exact commit
#
# This does NOT create a GitHub release. Tagging is cheap and safe; publishing
# artifacts is a judgement call, and that is release.yml's job. The two are kept
# apart so that a push can never quietly ship a half-built pool.
#
# Nothing is ever overwritten: if a tag already exists for a commit, it is left
# alone. Deleting a tag to re-tag is a manual operation on purpose.

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          date="$(date -u +%Y%m%d)"
          tag="v2-debs-${date}-${sha}"

          # git over https needs the token in the URL or an askpass helper.
          # Setting GH_TOKEN alone is not enough -- the first run of this
          # workflow failed with:
          #   fatal: could not read Username for 'https://github.com'
          # because ls-remote/push were talking to an anonymous remote. The
          # token is a per-step secret, so it is only ever in this URL.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # gh is the better tool for both halves of this: it reads GH_TOKEN
          # from the environment itself, so there is no URL to get wrong.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists; leaving it alone"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Lightweight tag: no message to keep in sync with the commit, and
          # `gh release create` turns it into a proper release when publishing.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null

          echo "tagged $GITHUB_SHA as $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          echo "### auto-tag" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "No release was created. Publish one with the" >> "$GITHUB_STEP_SUMMARY"
          echo "\`release\` workflow when the package pool is worth shipping." >> "$GITHUB_STEP_SUMMARY"