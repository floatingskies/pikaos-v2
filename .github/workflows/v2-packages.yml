name: v2 package builds

# Port of repo-tools/workflows/.gitea/scoped_workflows/nb-package-build.yml to a
# single monorepo.
#
# Upstream injects one scoped workflow into ~330 repos; here the "fleet" is the
# list in v2/ci/packages.tsv and one job builds one package with v2/pkg-build.sh.
# The Gitea-only pieces are deliberately gone:
#   * scoped-workflow injection -> a reusable workflow (workflow_call) + matrix
#   * incoming-dir allowlist / branch release gate / SSH deploy key -> nothing
#     is ever published; debs are uploaded as an artifact only
#   * binNMU reversion, Rust/LTO wrappers -> not needed by the boot/desktop set
#
# The hardening that is kept: apt index read from the local repo, a builder
# image pin (GHCR), and per-package failure artifacts.

on:
  workflow_dispatch:
    inputs:
      package:
        description: '"all" or a package slug from v2/ci/packages.tsv'
        type: string
        default: all
      image:
        description: Builder image ref (empty = default)
        type: string
        default: ''
      pull:
        description: Pull the builder image from GHCR instead of building locally
        type: boolean
        default: false
      upload:
        description: Upload the built debs as an artifact
        type: boolean
        default: true
  workflow_call:
    inputs:
      package:
        type: string
        default: all
      image:
        type: string
        default: ''
      pull:
        type: boolean
        default: false
      upload:
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: v2-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Expand the package list into a chunked matrix
        id: plan
        env:
          SEL: ${{ inputs.package }}
        run: |
          set -euo pipefail
          mapfile -t all < <(grep -vE '^[[:space:]]*(#|$)' v2/ci/packages.tsv)
          [ "${#all[@]}" -gt 0 ] || { echo "::error::v2/ci/packages.tsv is empty"; exit 1; }

          if [ -z "${SEL:-}" ] || [ "$SEL" = all ]; then
            picked=("${all[@]}")
          else
            picked=()
            for want in $(printf '%s' "$SEL" | tr ',' ' '); do
              hit=""
              for p in "${all[@]}"; do
                case "$p" in
                  "$want"|"${want##*/}") hit="$p"; break ;;
                esac
              done
              [ -n "$hit" ] || { echo "::error::unknown package '$want'; known: ${all[*]}"; exit 1; }
              picked+=("$hit")
            done
          fi

          # GitHub Actions caps a single workflow run at 256 jobs, and the fleet
          # is larger than that, so one matrix entry is a *chunk* of packages
          # rather than a single package. 200 leaves headroom for the other jobs
          # in a calling pipeline within the same run's limit.
          #
          # Chunking also keeps one runner's disk bounded: each job builds its
          # slice serially, and a chunk that fails takes down only its own leg.
          CHUNK=200
          total=${#picked[@]}
          nchunks=$(( (total + CHUNK - 1) / CHUNK ))
          chunks=()
          for ((i = 0; i < total; i += CHUNK)); do
            part=("${picked[@]:i:CHUNK}")
            pjson="$(printf '%s\n' "${part[@]}" | sed 's/.*/"&"/' | paste -sd, -)"
            chunks+=("{\"index\":$((i / CHUNK)),\"packages\":[$pjson]}")
          done
          {
            printf 'matrix={"chunk":[%s]}\n' "$(IFS=,; echo "${chunks[*]}")"
            printf 'count=%s\n' "$total"
          } >> "$GITHUB_OUTPUT"
          echo "selected $total package(s) in $nchunks chunk(s) of <=$CHUNK"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # The sid builder plus apt caches overflow the ephemeral runner on the
      # larger Pika packages; reclaim the preinstalled toolchains first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
          docker-images: false

      - name: Resolve the builder image
        id: img
        env:
          IN_IMAGE: ${{ inputs.image }}
          PULL: ${{ inputs.pull }}
        run: |
          set -euo pipefail
          img="$IN_IMAGE"
          if [ -z "$img" ] && [ "$PULL" = "true" ]; then
            img="ghcr.io/$GITHUB_REPOSITORY/pika-v2-builder:latest"
          fi
          echo "image=$img" >> "$GITHUB_OUTPUT"

      # The v2 repo (debs + .stamps) is not committed, so without this every run
      # rebuilds the whole fleet. v2/pkg-build.sh skips a package whose stamp
      # still matches its upstream commit and our build inputs, and the stamp
      # records which debs it produced.
      - name: Restore the v2 package pool
        uses: actions/cache@v4
        with:
          path: |
            v2/repo/pool/main
            v2/repo/.stamps
          key: v2-pool-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            v2-pool-${{ github.repository_id }}-

      # One matrix entry is a chunk of packages. Build them in order and keep
      # going past a failure: a package that does not build against sid must not
      # cost us the other 199 in its chunk, and the debs that *did* build are the
      # ones worth publishing.
      - name: Build chunk ${{ matrix.chunk.index }}
        id: build
        env:
          PKG_BUILDER_IMAGE: ${{ steps.img.outputs.image }}
          PKG_BUILDER_PULL: ${{ inputs.pull && '1' || '0' }}
          CHUNK: ${{ toJSON(matrix.chunk.packages) }}
        run: |
          set -uo pipefail
          mkdir -p v2/failed
          mapfile -t pkgs < <(printf '%s' "$CHUNK" | jq -r '.[]')
          echo "chunk ${{ matrix.chunk.index }}: ${#pkgs[@]} package(s)"
          failed=()
          for p in "${pkgs[@]}"; do
            echo "::group::$p"
            if ./v2/pkg-build.sh "$p"; then
              echo "::endgroup::"
              echo "::notice::$p built"
            else
              echo "::endgroup::"
              echo "::error title=build failed::$p"
              echo "$p" >> v2/failed/${{ matrix.chunk.index }}.txt
              failed+=("$p")
            fi
          done
          {
            echo "failed<<EOF"
            printf '%s\n' "${failed[@]:-}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload built debs
        if: always() && inputs.upload != false
        uses: actions/upload-artifact@v4
        with:
          name: v2-debs-chunk-${{ matrix.chunk.index }}
          path: |
            v2/repo/pool/main/*.deb
          if-no-files-found: warn
          retention-days: 30

      # A chunk that lost one package is still a usable chunk, so this is a
      # warning rather than a failure: the release job publishes what built and
      # lists what did not.
      - name: Report packages that did not build
        if: always()
        env:
          FAILED: ${{ steps.build.outputs.failed }}
        run: |
          set -euo pipefail
          n="$(printf '%s' "$FAILED" | grep -cv '^$' || true)"
          echo "chunk ${{ matrix.chunk.index }}: $n package(s) failed"
          [ -f v2/failed/${{ matrix.chunk.index }}.txt ] || exit 0
          while IFS= read -r p; do
            [ -n "$p" ] && echo "::warning title=not built::$p"
          done < v2/failed/${{ matrix.chunk.index }}.txt
