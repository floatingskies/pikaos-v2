name: pipeline

# One dispatch that runs the whole PikaOS-v2 chain, in the order the pieces
# depend on each other:
#
#   builder-images -> v2-packages -> repo-index -> iso
#                                     \-> repo-publish (GitHub Pages)
#
# Each stage is a reusable workflow and every stage can also be dispatched on
# its own (that is the point of splitting them: a package fix reruns
# v2-packages + repo-index + iso without rebuilding the images). Nothing is
# ever released.

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Which ISO recipe to build
        type: choice
        options: [both, minimal, full]
        default: both
      push_images:
        description: Push the builder images to GHCR (and pull them downstream)
        type: boolean
        default: true
      commit_index:
        description: Commit the refreshed apt index back to the branch
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    uses: ./.github/workflows/builder-images.yml
    with:
      push_images: ${{ inputs.push_images }}
      tag: ${{ github.ref_name }}

  packages:
    needs: images
    uses: ./.github/workflows/v2-packages.yml
    with:
      package: all
      pull: ${{ inputs.push_images }}
      upload: true

  # Run the rest of the chain even when some packages fail: the matrix is
  # fail-fast: false and every successful leg still uploads its debs, so a
  # partial apt repo + ISO is more useful than nothing. Only skip if the
  # package stage never ran at all (e.g. the images stage failed).
  repo:
    needs: packages
    if: ${{ always() && needs.packages.result != 'skipped' }}
    uses: ./.github/workflows/repo-index.yml
    with:
      commit: ${{ inputs.commit_index }}

  # Publish the flat apt repo to GitHub Pages (requires Pages enabled once in
  # Settings -> Pages -> Source: GitHub Actions).
  publish:
    needs: repo
    if: ${{ always() && needs.repo.result == 'success' }}
    uses: ./.github/workflows/repo-publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # Fail here, with the offending names, instead of letting the ISO build spend
  # twenty minutes on debootstrap only to have apt print a hundred "but it is
  # not going to be installed" lines with one real cause buried at the top.
  deps:
    needs: repo
    if: ${{ always() && needs.repo.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the v2 repo artifact
        uses: actions/download-artifact@v4
        with:
          name: v2-repo
          path: v2/repo

      - name: Pull the builder image
        uses: docker/login-action@v3
        if: ${{ inputs.push_images }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect the package list both recipes install
        run: |
          set -euo pipefail
          # Cover minimal and full: the union is what has to resolve.
          ( set -a; . iso-v2/info.sh; set +a
            printf '%s\n' $BASE_PKGS $INSTALLER_PKGS $FIRMWARE_PKGS \
                            $DESKTOP_PKGS $CODEC_PKGS $PIKA_PKGS ) \
            | tr ' ' '\n' | grep -v '^$' | sort -u > recipe.txt
          echo "recipe: $(wc -l < recipe.txt) packages"

      - name: Check the dependency closure against Debian sid
        env:
          IMAGE: ghcr.io/${{ github.repository }}/pika-v2-builder:latest
        run: |
          set -euo pipefail
          img="$IMAGE"
          if [ "${{ inputs.push_images }}" != "true" ]; then img=pika-v2-builder; fi
          pull=""; [ "${{ inputs.push_images }}" = "true" ] && pull="--pull=always"
          # shellcheck disable=SC2086
          docker run --rm $pull -v "$PWD:/w" -w /w "$img" \
            bash /w/v2/ci/check-sid-deps.sh /w/v2/repo/Packages /w/recipe.txt

  iso:
    needs: [repo, deps]
    if: ${{ always() && needs.repo.result == 'success' && needs.deps.result == 'success' }}
    uses: ./.github/workflows/iso.yml
    with:
      recipe: ${{ inputs.recipe }}
      pull: ${{ inputs.push_images }}
      use_repo_artifact: true
