name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Fast checks. These run on every push and must stay under a few minutes:
  # they never build a full ISO (the rootfs alone is ~7G, more than the
  # ephemeral runner disk). Full image builds are done locally with ./build.sh.
  # ---------------------------------------------------------------------
  kernel-config:
    name: kernel config sanity (x86-64-v2 target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify kernel fragment applies and keeps Ivy Bridge drivers
        run: |
          set -euo pipefail
          # Fetch the same kernel source the build uses.
          KVER=$(grep -oE 'KERNEL_VER="[^"]+"' config/pika.conf | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "kernel version: $KVER"
          mkdir -p /tmp/ksrc
          cd /tmp/ksrc
          wget -q "http://deb.debian.org/debian/pool/main/l/linux/linux_${KVER}.orig.tar.xz" \
            || wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KVER}.tar.xz"
          tar xf linux_*.tar.xz --strip-components=1

          # ORDER MATTERS: base config first, our fragment last.
          make -s x86_64_defconfig
          ./scripts/kconfig/merge_config.sh -m -O . .config /build/config/kernel/pika-v2.fragment >/dev/null 2>&1 \
            || ./scripts/kconfig/merge_config.sh -m -O . .config "$GITHUB_WORKSPACE/config/kernel/pika-v2.fragment" >/dev/null
          make -s olddefconfig

          # Every symbol below must be enabled or the image has no
          # graphics / audio / network / suspend on the target hardware.
          missing=""
          for sym in CONFIG_DRM_I915 CONFIG_SND_HDA_INTEL CONFIG_E1000E \
                     CONFIG_AGP_INTEL CONFIG_ATA_PIIX CONFIG_BTRFS_FS \
                     CONFIG_BLK_DEV_NVME CONFIG_BT_HCIBTUSB CONFIG_OVERLAY_FS \
                     CONFIG_MODULES; do
            grep -q "^${sym}=y" .config || missing="${missing} ${sym}"
          done
          if [ -n "$missing" ]; then
            echo "::error::kernel fragment dropped:${missing}"
            exit 1
          fi
          echo "all Ivy Bridge drivers present in .config"

      - name: Assert no above-v2 ISA in the kernel fragment
        run: |
          set -euo pipefail
          # The fragment must never ask for AVX2/FMA/BMI: Ivy Bridge would
          # SIGILL. Comments explaining WHY we avoid them are fine, so only
          # uncommented lines are considered.
          if grep -vE '^[[:space:]]*#' config/kernel/pika-v2.fragment \
             | grep -nE 'X86_64_V3|mavx2|mfma|x86-64-v3'; then
            echo "::error::v3/AVX2 flags found; the target is x86-64-v2 only"
            exit 1
          fi
          echo "no v3/AVX2 flags in the v2 kernel fragment"

  v2-build-config:
    name: v2 build-config is v2 (not v3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the -march level used for every component
        run: |
          set -euo pipefail
          # config/build-config/amd64-v2.sh must target x86-64-v2 and v2's
          # GOAMD64 level. It is the port of upstream amd64-v3.sh.
          # Strip comments first: the file explains the v3 origin in prose.
          live() { grep -vE '^[[:space:]]*#' "$1" || true; }

          live config/build-config/amd64-v2.sh | grep -q 'march=x86-64-v2' \
            || { echo "::error::amd64-v2.sh does not target x86-64-v2"; exit 1; }
          live config/build-config/amd64-v2.sh | grep -q 'GOAMD64="v2"' \
            || { echo "::error::amd64-v2.sh does not set GOAMD64=v2"; exit 1; }

          if live config/build-config/amd64-v2.sh | grep -q 'x86-64-v3'; then
            echo "::error::v3 leaked into the v2 build config"
            exit 1
          fi
          echo "v2 build config OK"


  cpu-level-detector:
    name: CPU level detector is correct for v1/v2/v3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detects v3 on a Haswell cpuinfo
        run: |
          set -euo pipefail
          cat > /tmp/haswell <<'EOF'
          model name	: Intel(R) Core(TM) i7-4770 CPU @ 3.40GHz
          vendor_id	: GenuineIntel
          flags		: fpu vme de pse tsc pni pclmulqdq ssse3 cx16 sse4_1 sse4_2 popcnt aes xsave avx f16c pni rdrand lahf_lm bmi1 avx2 bmi2 movbe fma xsaveopt arat
          EOF
          sed "s|/proc/cpuinfo|/tmp/haswell|g" config/pika-cpuidetect > /tmp/det
          chmod +x /tmp/det
          out=$(/tmp/det)
          echo "$out"
          grep -q '^level=v3$' <<<"$out" || { echo "::error::Haswell must be detected as v3"; exit 1; }

      - name: Detects v2 on an Ivy Bridge cpuinfo (the target machine)
        run: |
          set -euo pipefail
          cat > /tmp/ivy <<'EOF'
          model name	: Intel(R) Core(TM) i5-3550 CPU @ 3.30GHz
          vendor_id	: GenuineIntel
          flags		: fpu vme de pse tsc msr pae mce cx8 apic pni ssse3 cx16 sse4_1 sse4_2 popcnt xsave avx f16c pni lahf_lm movbe
          EOF
          sed "s|/proc/cpuinfo|/tmp/ivy|g" config/pika-cpuidetect > /tmp/det
          chmod +x /tmp/det
          out=$(/tmp/det)
          echo "$out"
          grep -q '^level=v2$' <<<"$out" || { echo "::error::Ivy Bridge must be v2, not v3"; exit 1; }
          grep -q '^v3_ok=0$' <<<"$out" || { echo "::error::Ivy Bridge must not claim v3"; exit 1; }
          # The missing set must name the exact features Ivy Bridge lacks.
          for f in avx2 bmi1 bmi2 fma; do
            grep -q "$f" <<<"$out" || { echo "::error::missing_v3 should list $f"; exit 1; }
          done

      - name: Detects v1 on a pre-Nehalem cpuinfo
        run: |
          set -euo pipefail
          cat > /tmp/old <<'EOF'
          model name	: Intel(R) Pentium(R) 4 CPU 3.00GHz
          vendor_id	: GenuineIntel
          flags		: fpu vme de pse tsc msr pae mce cx8 apic mtrr pge mca cmov pat pse36 clflush mmx fxsr sse sse2 ht syscall nx lm
          EOF
          sed "s|/proc/cpuinfo|/tmp/old|g" config/pika-cpuidetect > /tmp/det
          chmod +x /tmp/det
          out=$(/tmp/det)
          echo "$out"
          grep -q '^level=v1$' <<<"$out" || { echo "::error::pre-Nehalem must be v1"; exit 1; }

  installer-uses-grub:
    name: installer uses GRUB and never rEFInd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert GRUB boot paths and the absence of rEFInd
        run: |
          set -euo pipefail
          # The installer must drive grub-install for both firmware modes.
          grep -q 'target=x86_64-efi' config/pika-install || { echo "::error::no UEFI grub path"; exit 1; }
          grep -q 'target=i386-pc'  config/pika-install || { echo "::error::no BIOS grub path"; exit 1; }
          grep -q 'grub-install' config/pika-install || { echo "::error::grub-install not called"; exit 1; }
          grep -q '/sys/firmware/efi' config/pika-install || { echo "::error::no firmware detection"; exit 1; }
          # And rEFInd must not creep back in: no line may actually install it.
          # Mentions in comments, in the purge path, or inside a user-facing
          # message string are all fine.
          # Usage, not mentions: the installer legitimately says "not rEFInd"
          # and the licence notices name PikaOS. Flag only actual use.
          if grep -rinE 'refind-install|efibootmgr.*refind|bootloader=refind|grub-install.*refind' \
               config/ iso-v2/ \
             | grep -viE 'purge|remove|say |printf' \
             | grep -iE 'apt-get|apt install|install |cp |ln -s'; then
            echo "::error::rEFInd is being installed somewhere"
            exit 1
          fi
          echo "GRUB-only bootloader confirmed"

      - name: Installer must run the CPU gate before partitioning
        run: |
          set -euo pipefail
          # check_cpu_level has to be called from main() before choose_disk.
          awk '/^main\(\)/,/^}/' config/pika-install > /tmp/main.txt
          grep -q 'check_cpu_level' /tmp/main.txt || { echo "::error::main() does not gate on CPU level"; exit 1; }
          grep -q 'pika-cpuidetect' config/pika-install || { echo "::error::installer never calls the detector"; exit 1; }
          # Ordering: the gate must come first.
          line_cpu=$(grep -n 'check_cpu_level' /tmp/main.txt | head -1 | cut -d: -f1)
          line_disk=$(grep -n 'choose_disk' /tmp/main.txt | head -1 | cut -d: -f1)
          [ "$line_cpu" -lt "$line_disk" ] || { echo "::error::CPU check must run before disk selection"; exit 1; }
          echo "CPU gate runs before any disk operation"

  no-upstream-dependency:
    name: no dependency on the PikaOS upstream repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pikman source
        # The job below asserts that pikman builds with GOPROXY=off, which needs
        # the sources. Cloning here (shallow) keeps ~1MB of vendored Go code out
        # of this repository; the assertion stays meaningful because the build
        # itself still runs with the network disabled for module fetching.
        run: |
          set -euo pipefail
          git clone --depth 1 https://git.pika-os.com/general-packages/pikman.git upstream/pikman

      - name: Assert we don't point apt at upstream PikaOS
        run: |
          set -euo pipefail
          # The image must be buildable without git.pika-os.com / pkg.pika-os.com.
          # Comments explaining the omission are fine; a live sources.list or
          # apt invocation is not.
          # Only *apt* usage counts. pkg-build.sh clones from git.pika-os.com on
          # purpose (that is where the sources live) and the licence notices
          # have to name upstream, so flag a repo line or an apt invocation
          # aimed at PikaOS rather than any mention.
          if grep -rnE '^[[:space:]]*deb .*(pkg|git)\.pika-os\.com' \
               config/ iso-v2/ | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(#|\*)'; then
            echo "::error::a sources.list entry points at the PikaOS upstream repo"
            exit 1
          fi
          if grep -rnE 'apt(-get)?\b[^|;&]*(pkg|git)\.pika-os\.com' \
               config/ iso-v2/ | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(#|\*)'; then
            echo "::error::an apt invocation points at the PikaOS upstream repo"
            exit 1
          fi
          # Every sources.list we write must be plain Debian sid. MIRROR/SECURITY are
          # shell variables defined to deb.debian.org, so allow those tokens.
          # A 'deb' line containing a shell variable is resolved at run time
          # (MIRROR -> deb.debian.org, PIKA_V2_REPO_URL -> the Pages repo,
          # REPO_MNT -> the local ISO pool) and cannot be checked statically, so
          # only literal hosts are enforced here; the PikaOS apt checks above
          grep -rhE '^[[:space:]]*deb ' config/pika-install iso-v2/*.sh iso-v2/config/*.sh \
            | grep -v 'deb.debian.org' \
            | grep -vE '^[[:space:]]*deb .*[$]\{?[A-Za-z_]' && {
            echo "::error::a sources.list entry points somewhere unexpected"
            exit 1
          }
          echo "no upstream apt dependency"

  # ---------------------------------------------------------------------
  # The ISA shim table decides what gets rewritten from v3 to v2 before a
  # package builds. It is a plain text file, so nothing but these two jobs
  # stops a typo in it from shipping a v3 binary to an Ivy Bridge CPU -- or,
  # worse, from silently matching nothing and reporting success.
  # ---------------------------------------------------------------------
  isa-shims:
    name: v3 -> v2 ISA shims are well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every shim is a well-formed from|to pair with a trailing newline
        run: |
          set -euo pipefail
          f=v2/ci/isa-shims.txt
          [ -s "$f" ] || { echo "::error::$f is empty or missing"; exit 1; }

          # `read` drops a final line with no trailing newline, and this file is
          # consumed by a while-read loop in pkg-build.sh. A dropped last line
          # is a silently skipped rewrite, so assert the newline here.
          if [ -n "$(tail -c 1 "$f")" ]; then
            echo "::error::$f does not end in a newline; its last shim would be silently dropped"
            exit 1
          fi

          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|\#*) continue ;; esac
            n=$((n + 1))
            case "$line" in
              *'|'*) ;;
              *) echo "::error::malformed shim (no '|'): $line"; exit 1 ;;
            esac
            from="${line%%|*}"; to="${line#*|}"
            [ -n "$from" ] || { echo "::error::empty 'from' in: $line"; exit 1; }
            [ -n "$to" ]   || { echo "::error::empty 'to' in: $line"; exit 1; }
            # A shim that rewrites v3 into something that is still v3 is a no-op
            # that looks like it worked.
            case "$to" in
              *v3*|*V3*|*mavx2*|*mfma*)
                echo "::error::shim target still references v3: $line"; exit 1 ;;
            esac
            # And a shim whose source is already v2-only would never match.
            case "$from" in
              *x86_64_v2*|*march=x86-64-v2*)
                echo "::error::shim source is already v2; it can never match: $line"; exit 1 ;;
            esac
          done < "$f"
          [ "$n" -gt 0 ] || { echo "::error::no active shims in $f"; exit 1; }
          echo "$n shim(s), all well formed"

      - name: Every shim source string still exists upstream
        run: |
          set -euo pipefail
          # A shim that no longer matches anything is dead weight that reads as
          # coverage: if upstream renamed the flag, the v3 target silently comes
          # back. Require each source string to be found in the repo it targets,
          # and fail if it is not, so the shim is updated at the same time as
          # upstream changes.
          #
          # repo|path-glob is derived from the shim itself; the mapping is
          # declared here because a shim has no way to say which repo it is for.
          declare -A REPO_OF=(
            ['-Dcpu=x86_64_v3']=otter-shell/otter-zenith
            ['ZIG_TARGET_MCPU "x86_64_v3"']=general-packages/zig
            ['--set-val X86_64_VERSION 3']=kernel-packages/linux-pikaos-7.2
          )
          missing=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|\#*) continue ;; esac
            from="${line%%|*}"
            repo="${REPO_OF[$from]:-}"
            if [ -z "$repo" ]; then
              echo "::error::no repo declared for shim source: $from"
              missing=$((missing + 1))
              continue
            fi
            # git clone, not the archive endpoint: the gitea returns 403 for
            # /archive/refs/heads/*.tar.gz to an unauthenticated client, so
            # that version of this check reported every shim as stale.
            tmp="$(mktemp -d)"
            if git clone --depth 1 -q "https://git.pika-os.com/$repo.git" "$tmp/r" 2>/dev/null; then
              if grep -rqF -e "$from" "$tmp/r"; then
                echo "ok: '$from' present in $repo"
              else
                echo "::error::shim source '$from' no longer found in $repo; upstream moved and this would silently stop rewriting"
                missing=$((missing + 1))
              fi
            else
              # An unreachable repo is not evidence that a shim is stale.
              echo "::warning::could not clone $repo; skipping the staleness check for '$from'"
            fi
            rm -rf "$tmp"
          done < v2/ci/isa-shims.txt
          [ "$missing" -eq 0 ] || { echo "::error::$missing shim(s) are stale"; exit 1; }

  fleet-list:
    name: package fleet list is sane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No duplicates and no v3 slugs
        run: |
          set -euo pipefail
          mapfile -t all < <(grep -vE '^[[:space:]]*(#|$)' v2/ci/packages.tsv)
          [ "${#all[@]}" -gt 0 ] || { echo "::error::packages.tsv is empty"; exit 1; }

          dups="$(printf '%s\n' "${all[@]}" | sort | uniq -d)"
          if [ -n "$dups" ]; then
            echo "::error::duplicate entries in packages.tsv:"
            printf '  %s\n' $dups
            exit 1
          fi

          # Each entry must be org/name and name must be lowercase-dashed; a
          # typo here becomes a clone that fails much later, in CI.
          for p in "${all[@]}"; do
            case "$p" in
              */*/*)  echo "::error::malformed slug (too many '/'): $p"; exit 1 ;;
              */*)    ;;
              *)      echo "::error::slug without an org: $p"; exit 1 ;;
            esac
            name="${p##*/}"
            case "$name" in
              [a-z0-9]*) ;;
              *) echo "::error::unexpected package name '$name' in $p"; exit 1 ;;
            esac
          done

          echo "${#all[@]} packages, no duplicates, all slugs well formed"

      - name: Fleet fits inside the Actions matrix limit
        run: |
          set -euo pipefail
          # v2-packages chunks the fleet because a run is capped at 256 jobs.
          # Keep the chunk size and the fleet in the same file so a future edit
          # to one cannot quietly break the other.
          CHUNK="$(grep -oE '^ *CHUNK=[0-9]+' .github/workflows/v2-packages.yml \
                    | grep -oE '[0-9]+' | head -1)"
          [ -n "$CHUNK" ] || { echo "::error::could not find CHUNK in v2-packages.yml"; exit 1; }
          n=$(grep -cvE '^[[:space:]]*(#|$)' v2/ci/packages.tsv)
          echo "fleet=$n chunk=$CHUNK -> $(( (n + CHUNK - 1) / CHUNK )) job(s)"
          [ "$CHUNK" -le 256 ] || { echo "::error::CHUNK=$CHUNK exceeds the 256-job cap"; exit 1; }

  shellcheck:
    name: shellcheck image build + installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint
        run: |
          # SC1091: dynamic source of the build config; SC2317: trap bodies;
          # SC2034: variables consumed by the build config. Fail on warning and
          # above. This is the code the v2 image actually ships.
          shellcheck -S warning -e SC1091,SC2317,SC2034,SC2010 \
            iso-v2/*.sh iso-v2/config/*.sh config/pika-install config/pika-cpuidetect \
            v2/pkg-build.sh v2/ci/repo-index.sh
